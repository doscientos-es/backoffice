name: Process scheduled email marketing

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: email-marketing-delivery
  cancel-in-progress: false

jobs:
  deliver:
    name: Process due emails and queued recipients
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call the email marketing endpoint
        run: |
          STATUS=$(curl --silent --output /tmp/email-marketing.json \
                        --write-out "%{http_code}" \
                        --max-time 240 \
                        -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                        "${{ secrets.APP_URL }}/api/cron/email-marketing")

          echo "HTTP status: $STATUS"
          cat /tmp/email-marketing.json | python3 -m json.tool || true

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::El endpoint devolvió HTTP $STATUS"
            exit 1
          fi
